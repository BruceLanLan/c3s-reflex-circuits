[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c3s"
version = "0.1.0"
description = "Connectome-constrained circuit synthesis: from a fly escape pathway to verified NAND/LATCH netlists"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
connectome = ["pyarrow>=15", "pandas>=2"]
learn = ["torch>=2.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["c3s*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running exhaustive or training tests"]
