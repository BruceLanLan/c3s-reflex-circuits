<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Boundary console · 边界值班台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #15181C; --panel: #1C2025; --panel2: #202529; --line: #2B3037; --text: #ECE7DC; --dim: #979CA3;
          --faint: #5E646C; --ok: #46C878; --bad: #E36A52; --amber: #F2A541; --blue: #6FA8DC;
          --agent: #6FA8DC; --tool: #F2A541;
          --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--dim); font: 14px/1.5 system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; overflow-x: hidden; }
  a { color: var(--blue); text-decoration: none; }
  code, .mono, .num { font-family: var(--mono); font-size: 12.5px; }
  .num { color: var(--text); font-variant-numeric: tabular-nums; }
  .muted { color: var(--faint); }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .amber { color: var(--amber); }
  .c-agent { color: var(--agent); } .c-tool { color: var(--tool); }

  /* top bar */
  header { position: sticky; top: 0; z-index: 2; background: #111417; border-bottom: 1px solid var(--line); }
  .bar { max-width: 1120px; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 12.5px; }
  .bar h1 { margin: 0; font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: .01em; }
  .bar h1 small { color: var(--faint); font-weight: 400; margin-left: 6px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin-right: 6px; vertical-align: 0; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 6px rgba(70,200,120,.5); }
  .dot.bad { background: var(--bad); } .dot.amber { background: var(--amber); }
  .spacer { flex: 1; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .lang button { background: none; border: 0; color: var(--dim); padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .lang button.on { background: var(--line); color: var(--text); }

  main { max-width: 1120px; margin: 0 auto; padding: 18px 16px 48px; display: grid; gap: 16px; }
  section { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  h2 .sub { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--faint); font-size: 12px; }
  html[lang="zh-CN"] h2 { text-transform: none; letter-spacing: .04em; font-size: 12px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
  p.lead { margin: 0 0 12px; font-size: 13px; color: var(--dim); }
  p.lead b { color: var(--text); font-weight: 500; }

  /* badges for the channel a rule rests on */
  .badge { display: inline-block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; border: 1px solid transparent; white-space: nowrap; vertical-align: 1px; }
  .badge.cost { color: var(--agent); border-color: rgba(111,168,220,.45); background: rgba(111,168,220,.08); }
  .badge.boundary { color: var(--tool); border-color: rgba(242,165,65,.45); background: rgba(242,165,65,.08); }
  .badge.count { color: var(--text); border-color: var(--faint); }

  /* rule editor */
  .rules { display: grid; gap: 10px; }
  .rule { display: grid; grid-template-columns: 92px 1fr; gap: 6px 12px; align-items: start; padding: 8px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; }
  .rule input[type=number] { width: 100%; }
  .rule .name { color: var(--text); font-size: 13px; font-weight: 500; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
  .rule .name code { color: var(--faint); font-size: 11.5px; }
  .rule .hint { font-size: 12px; color: var(--faint); line-height: 1.4; margin-top: 2px; }
  .rule .chan { font-size: 12px; margin-top: 3px; }
  .rule .chan code { font-size: 11.5px; }
  .rule .chan.cost code { color: var(--agent); } .rule .chan.boundary code { color: var(--tool); }
  .rule .tog { display: flex; align-items: center; gap: 8px; padding-top: 3px; }
  .rule .tog input { width: 16px; height: 16px; margin: 0; accent-color: var(--tool); }
  @media (max-width: 480px) { .rule { grid-template-columns: 1fr; } .rule input[type=number] { max-width: 120px; } }
  .domain { font-size: 12px; color: var(--faint); }
  .domain.warn { color: var(--amber); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
  .note { font-size: 12px; color: var(--faint); }

  input, select { background: #14171a; border: 1px solid var(--line); color: var(--text); padding: 6px 8px; font: inherit; font-size: 13px; border-radius: 6px; min-width: 0; }
  input[type=number] { font-family: var(--mono); }
  input:focus { outline: 1px solid var(--amber); border-color: var(--amber); }
  button { font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  button.go { border: 0; border-radius: 8px; padding: 7px 16px; font-weight: 600; color: #121417; background: var(--text); }
  button.go.agent { background: var(--agent); } button.go.tool { background: var(--tool); }
  button.pre { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 6px; padding: 4px 9px; font-size: 12px; }
  button.pre:hover { color: var(--text); border-color: var(--faint); }
  button.pre.tool { border-color: rgba(242,165,65,.5); color: var(--tool); }
  button.pre.tool:hover { border-color: var(--tool); }
  .msg { font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .msg:empty { display: none; }

  /* evidence */
  .verdicts { display: grid; gap: 8px; margin-bottom: 10px; }
  .verdict-row { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); border-left-width: 3px; }
  .verdict-row.ok { border-left-color: var(--ok); } .verdict-row.bad { border-left-color: var(--bad); }
  .verdict-row .mark { font-family: var(--mono); font-weight: 700; font-size: 15px; line-height: 1.3; }
  .verdict-row.ok .mark { color: var(--ok); } .verdict-row.bad .mark { color: var(--bad); }
  .verdict-row .head { color: var(--text); font-weight: 500; font-size: 13px; }
  .verdict-row .body { font-size: 12.5px; color: var(--dim); margin-top: 2px; }
  .verdict-row .body b { color: var(--text); font-weight: 500; font-family: var(--mono); font-size: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .tile { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
  .tile .k { font-size: 11px; color: var(--faint); letter-spacing: .04em; }
  .tile .v { font-family: var(--mono); font-size: 17px; color: var(--text); line-height: 1.3; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tile .v small { font-size: 11.5px; color: var(--dim); margin-left: 3px; }
  .words { margin: 0 0 10px; padding: 0; list-style: none; display: grid; gap: 4px; }
  .words li { display: grid; grid-template-columns: 14px 1fr; gap: 6px; font-size: 13px; color: var(--text); }
  .words li::before { content: "·"; color: var(--faint); }
  .words li .en { display: block; font-size: 11.5px; color: var(--faint); font-family: var(--mono); }
  .viol { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; margin-bottom: 10px; }
  .viol span { color: var(--faint); } .viol b { color: var(--text); font-family: var(--mono); font-weight: 500; }
  .viol b.bad { color: var(--bad); }
  details { font-size: 12px; color: var(--faint); }
  summary { cursor: pointer; }
  pre { margin: 6px 0 0; padding: 10px 12px; background: #111417; border: 1px solid var(--line); border-radius: 6px; font-family: var(--mono); font-size: 11.5px; line-height: 1.5; color: var(--text); overflow-x: auto; white-space: pre; }
  pre.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
  pre .c { color: var(--faint); }
  .prov { font-size: 12px; color: var(--faint); margin-top: 10px; }
  .prov code { color: var(--dim); }

  /* channels */
  .who { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 12px; font-size: 13px; }
  .who input { width: 220px; max-width: 100%; }
  .channels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .channels { grid-template-columns: 1fr; } }
  .panel { border-radius: 8px; padding: 12px 14px; background: var(--panel2); border: 1px solid var(--line); border-top: 3px solid var(--faint); display: grid; gap: 10px; align-content: start; min-width: 0; }
  .panel.agent { border-top-color: var(--agent); } .panel.tool { border-top-color: var(--tool); }
  .panel h3 { margin: 0; font-size: 13px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .panel.agent h3 { color: var(--agent); } .panel.tool h3 { color: var(--tool); }
  .panel h3 code { color: var(--dim); font-size: 12px; }
  .panel .writer { font-size: 12.5px; color: var(--dim); }
  .panel .writer b { color: var(--text); font-weight: 500; }
  .panel label { display: grid; gap: 3px; font-size: 12px; color: var(--dim); min-width: 0; }
  .panel label .hint { font-size: 11.5px; color: var(--faint); }
  .panel .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
  .panel .check input { width: 16px; height: 16px; margin: 0; accent-color: var(--agent); }
  .panel .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .armed { font-size: 12.5px; }
  .armed b { font-family: var(--mono); font-weight: 600; color: var(--text); }
  .armed b.hi { color: var(--tool); }

  /* tables */
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--faint); font-weight: 500; padding: 4px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: 12px; }
  td { padding: 6px 10px 6px 0; color: var(--text); vertical-align: top; }
  td.name { overflow-wrap: anywhere; max-width: 22ch; }
  tr + tr td { border-top: 1px solid #23282e; }
  td.num { white-space: nowrap; }
  @media (max-width: 700px) {
    #agents tr:first-child { display: none; }
    #agents, #agents tbody, #agents tr, #agents td { display: block; }
    #agents tr { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--panel2); }
    #agents tr + tr { margin-top: 8px; }
    #agents td { padding: 3px 0; border: 0 !important; display: grid; grid-template-columns: minmax(8em, auto) 1fr; gap: 8px; white-space: normal; max-width: none; }
    #agents td::before { content: attr(data-l); color: var(--faint); font-family: system-ui, -apple-system, "PingFang SC", sans-serif; font-size: 12px; }
    #agents td:first-child { grid-template-columns: 1fr; font-weight: 600; padding-bottom: 5px; }
    #agents td:first-child::before { content: none; }
  }

  /* decision log */
  .log { display: grid; gap: 6px; }
  .e { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 8px 10px; background: var(--panel2); border: 1px solid var(--line); border-left-width: 3px; border-radius: 6px; font-size: 13px; min-width: 0; }
  .e.ok { border-left-color: var(--ok); } .e.no { border-left-color: var(--faint); } .e.tool { border-left-color: var(--tool); } .e.policy { border-left-color: var(--agent); } .e.err { border-left-color: var(--bad); }
  .e .t { font-family: var(--mono); font-size: 12px; color: var(--faint); padding-top: 2px; }
  .e .h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; min-width: 0; }
  .e .h .agent { color: var(--text); font-weight: 600; overflow-wrap: anywhere; }
  .e .h .bits { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .e .h .bits .t1 { color: var(--tool); }
  .e .verdict { font-family: var(--mono); font-size: 11.5px; font-weight: 700; letter-spacing: .06em; padding: 1px 7px; border-radius: 4px; }
  .e.ok .verdict { background: rgba(70,200,120,.14); color: var(--ok); }
  .e.no .verdict { background: rgba(151,156,163,.14); color: var(--dim); }
  .e.tool .verdict { background: rgba(242,165,65,.14); color: var(--tool); }
  .e.policy .verdict { background: rgba(111,168,220,.14); color: var(--agent); }
  .e.err .verdict { background: rgba(227,106,82,.14); color: var(--bad); }
  .e .d { color: var(--dim); margin-top: 2px; font-size: 12.5px; overflow-wrap: anywhere; }
  .e .d b { color: var(--text); font-weight: 500; }
  .e .reason { color: var(--faint); font-style: italic; overflow-wrap: anywhere; }
  .why { margin: 3px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; }
  .why li { font-family: var(--mono); font-size: 12px; color: var(--text); display: grid; grid-template-columns: 12px 1fr; gap: 4px; }
  .why li::before { content: "↳"; color: var(--faint); }
  @media (max-width: 480px) { .e { grid-template-columns: 1fr; gap: 2px; } }

  /* notes */
  .notes { display: grid; gap: 8px; font-size: 12.5px; }
  .notes div { display: grid; grid-template-columns: 14px 1fr; gap: 8px; }
  .notes div::before { content: "—"; color: var(--faint); }
  .notes div.key { padding: 8px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; grid-template-columns: 1fr; color: var(--text); }
  .notes div.key::before { content: none; }
  .notes b { color: var(--text); font-weight: 500; }
  .connect p { margin: 8px 0 6px; font-size: 12.5px; }
  footer { max-width: 1120px; margin: 0 auto; padding: 0 16px 24px; font-size: 11.5px; color: var(--faint); }
</style>

<header>
  <div class="bar">
    <h1>reflex-console <small id="circuit" class="mono">…</small></h1>
    <span><i class="dot" id="svc-dot"></i><span id="svc"></span></span>
    <span><i class="dot" id="chain-dot"></i><span id="chain"></span></span>
    <span class="mono" id="clock"></span>
    <span class="spacer"></span>
    <span class="lang"><button data-lang="zh">中文</button><button data-lang="en">EN</button></span>
  </div>
</header>

<main>
  <div class="two">
    <section>
      <h2><span data-i18n="h.rules"></span><span class="sub" data-i18n="h.rules.sub"></span></h2>
      <form id="rules" class="rules" autocomplete="off">
        <div class="rule">
          <input id="r-gap" type="number" min="0" max="255" step="1" required>
          <div><div class="name"><span data-i18n="r.gap"></span><code>min_gap_ticks</code><span class="badge count" data-i18n="b.count"></span></div>
            <div class="hint" data-i18n="r.gap.hint"></div><div class="chan count" data-i18n="r.gap.chan"></div></div>
        </div>
        <div class="rule">
          <input id="r-commit" type="number" min="0" max="255" step="1" required>
          <div><div class="name"><span data-i18n="r.commit"></span><code>commit_ticks</code><span class="badge cost" data-i18n="b.cost"></span></div>
            <div class="hint" data-i18n="r.commit.hint"></div><div class="chan cost" data-i18n="r.commit.chan"></div></div>
        </div>
        <div class="rule">
          <div class="tog"><input id="r-blocked" type="checkbox"></div>
          <div><div class="name"><span data-i18n="r.blocked"></span><code>forbid_when_blocked</code><span class="badge boundary" data-i18n="b.boundary"></span></div>
            <div class="hint" data-i18n="r.blocked.hint"></div><div class="chan boundary" data-i18n="r.blocked.chan"></div></div>
        </div>
        <div class="rule">
          <input id="r-max" type="number" min="0" max="255" step="1" required>
          <div><div class="name"><span data-i18n="r.max"></span><code>max_grants</code><span class="badge count" data-i18n="b.count"></span></div>
            <div class="hint" data-i18n="r.max.hint"></div><div class="chan count" data-i18n="r.max.chan"></div></div>
        </div>
        <div class="rule">
          <input id="r-confirm" type="number" min="0" max="255" step="1" required>
          <div><div class="name"><span data-i18n="r.confirm"></span><code>confirm_window_ticks</code><span class="badge boundary" data-i18n="b.boundary"></span></div>
            <div class="hint" data-i18n="r.confirm.hint"></div><div class="chan boundary" data-i18n="r.confirm.chan"></div></div>
        </div>
        <div class="presets">
          <span class="muted" data-i18n="r.presets"></span>
          <button class="pre" type="button" data-preset="8,4,1,0,0" data-i18n="p.fly"></button>
          <button class="pre" type="button" data-preset="4,0,1,3,6" data-i18n="p.confirm"></button>
          <button class="pre" type="button" data-preset="0,0,0,0,0" data-i18n="p.open"></button>
          <button class="pre" type="button" id="r-reload" data-i18n="p.current"></button>
        </div>
        <div class="domain" id="domain"></div>
        <div class="actions">
          <button class="go" type="submit" id="install" data-i18n="r.install"></button>
          <span class="note" data-i18n="r.install.note"></span>
        </div>
        <div class="msg" id="install-msg"></div>
      </form>
    </section>

    <section>
      <h2><span data-i18n="h.evidence"></span><span class="sub" data-i18n="h.evidence.sub"></span></h2>
      <ul class="words" id="words"></ul>
      <div class="verdicts" id="verdicts"></div>
      <div class="tiles" id="tiles"></div>
      <div class="viol" id="viol"></div>
      <details><summary id="netlist-sum"></summary><pre class="wrap" id="netlist"></pre></details>
      <div class="prov" id="prov"></div>
    </section>
  </div>

  <section>
    <h2><span data-i18n="h.channels"></span><span class="sub" data-i18n="h.channels.sub"></span></h2>
    <p class="lead" id="channels-lead"></p>
    <div class="who">
      <label for="agent" data-i18n="f.agent"></label>
      <input id="agent" value="console" maxlength="40">
      <span class="note" data-i18n="f.agent.hint"></span>
    </div>
    <div class="channels">
      <form class="panel agent" id="req">
        <h3><span data-i18n="a.title"></span><code id="a-inputs"></code></h3>
        <div class="writer" data-i18n="a.writer"></div>
        <label class="check"><input id="intent" type="checkbox" checked><span data-i18n="a.intent"></span></label>
        <label><span data-i18n="a.reason"></span><input id="reason" maxlength="160"><span class="hint" data-i18n="a.reason.hint"></span></label>
        <div class="row"><button class="go agent" type="submit" id="send" data-i18n="a.send"></button><span class="note" data-i18n="a.send.hint"></span></div>
      </form>
      <div class="panel tool">
        <h3><span data-i18n="t.title"></span><code id="t-inputs"></code></h3>
        <div class="writer" data-i18n="t.writer"></div>
        <div class="armed" id="armed"></div>
        <div class="row">
          <button class="pre tool" type="button" data-tool="blocked,1" data-i18n="t.block"></button>
          <button class="pre tool" type="button" data-tool="blocked,0" data-i18n="t.unblock"></button>
          <button class="pre tool" type="button" data-tool="confirm,1" data-i18n="t.confirm"></button>
        </div>
        <div class="note" data-i18n="t.hint"></div>
      </div>
    </div>
    <div class="msg" id="last" style="margin-top:12px"></div>
  </section>

  <section>
    <h2><span data-i18n="h.agents"></span><span class="sub" data-i18n="h.agents.sub"></span></h2>
    <div class="wrap"><table id="agents"><tbody></tbody></table></div>
  </section>

  <section>
    <h2><span data-i18n="h.log"></span><span class="sub" id="log-sub"></span></h2>
    <div class="log" id="log"></div>
  </section>

  <div class="two">
    <section>
      <h2><span data-i18n="h.notes"></span></h2>
      <div class="notes" id="notes"></div>
    </section>
    <section class="connect">
      <h2><span data-i18n="h.connect"></span><span class="sub" data-i18n="h.connect.sub"></span></h2>
      <p data-i18n="c.intro"></p>
      <pre id="curl"></pre>
    </section>
  </div>
</main>
<footer id="foot"></footer>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const N = (v) => Number(v) || 0;

// ---------- text ----------
const T = {
  zh: {
    "h.rules": "规则", "h.rules.sub": "五条设置，各自落在哪个通道上",

const R = { gap: $("r-gap"), commit: $("r-commit"), blocked: $("r-blocked"), max: $("r-max"), confirm: $("r-confirm") };
const bitlen = (v) => { let n = 0; for (let x = Math.floor(v); x > 0; x >>= 1) n++; return n; };
const width = (limit) => Math.max(1, bitlen(limit));
function editorSettings() {
  return { min_gap_ticks: N(R.gap.value), commit_ticks: N(R.commit.value), forbid_when_blocked: R.blocked.checked,
           max_grants: N(R.max.value), confirm_window_ticks: N(R.confirm.value) };
}
function domainPreview() {
  const s = editorSettings();
  const state = (s.min_gap_ticks > 1 ? width(s.min_gap_ticks - 1) : 0) + (s.commit_ticks ? width(s.commit_ticks) : 0)
              + (s.max_grants ? width(s.max_grants) : 0) + (s.confirm_window_ticks > 1 ? width(s.confirm_window_ticks - 1) : 0);
  const bits = 4 + state, over = bits > 26;
  $("domain").className = `domain${over ? " warn" : ""}`;
  $("domain").textContent = t("r.domain", { state, bits, rows: over ? "—" : num(2 ** bits) }) + (over ? ` ${t("r.domain.warn")}` : "");
}
function fillEditor(s) {
  R.gap.value = N(s.min_gap_ticks); R.commit.value = N(s.commit_ticks); R.blocked.checked = !!s.forbid_when_blocked;
  R.max.value = N(s.max_grants); R.confirm.value = N(s.confirm_window_ticks);
  domainPreview();
}
Object.values(R).forEach((el) => el.addEventListener("input", domainPreview));
document.querySelectorAll("[data-preset]").forEach((b) => b.addEventListener("click", () => {
  const [g, c, bl, m, w] = b.dataset.preset.split(",").map(Number);
  fillEditor({ min_gap_ticks: g, commit_ticks: c, forbid_when_blocked: !!bl, max_grants: m, confirm_window_ticks: w });
  INSTALL = null; $("install-msg").textContent = "";
}));
$("r-reload").addEventListener("click", () => { if (STATE) fillEditor(STATE.policy.settings); });
let editorFilled = false, INSTALL = null;  // last install outcome, re-rendered on a language switch
function showInstall() {
  const m = INSTALL;
  if (!m) return;
  if (m.status === "sending") $("install-msg").innerHTML = `<span class="muted">${t("r.installing")}</span>`;
  else if (m.status === "neterr") $("install-msg").innerHTML = `<span class="bad">${t("r.neterr", { e: esc(m.error) })}</span>`;
  else if (m.status !== 200) $("install-msg").innerHTML = `<span class="bad">${t("r.refused", { code: N(m.status), err: esc(m.error) })}</span>`;
  else {
    const d = m.summary, ok = d.checked.every_rule_holds;
    $("install-msg").innerHTML = `<span class="${ok ? "ok" : "bad"}">${t("r.installed", { nand: num(d.circuit.nand), latch: num(d.circuit.latch), rows: num(d.checked.rows), holds: t(ok ? "hdr.holds" : "hdr.fails"), ms: num(d.compiled_in_ms) })}</span>`;
  }
}
$("rules").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("install").disabled = true; INSTALL = { status: "sending" }; showInstall();
  try {
    const r = await fetch("/api/policy", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(editorSettings()) });
    const d = await r.json();
    INSTALL = r.ok ? { status: 200, summary: d } : { status: r.status, error: d.error };
    if (r.ok) fillEditor(d.settings);
  } catch (err) { INSTALL = { status: "neterr", error: err.message }; }
  showInstall();
  $("install").disabled = false;
  refresh();
});

// ---------- live state ----------
let STATE = null, LAST = null, lastOk = 0;
const OPENED = Date.now();

function chainStatus(s) {
  if (!s.chain || !s.chain.enabled) return ["", "chain.off"];
  const e = s.transcript.find((x) => x.kind === "request" && x.chain);
  if (!e) return ["", "chain.idle"];
  if (e.chain.error) return ["amber", "chain.err"];
  return e.chain.agrees ? ["ok", "chain.ok"] : ["bad", "chain.dis"];
}

function render(s) {
  STATE = s;
  const p = s.policy, c = p.circuit, k = p.checked, st = p.settings;
  if (!editorFilled) { fillEditor(st); editorFilled = true; }

  // header
  const nRules = [N(st.min_gap_ticks), N(st.commit_ticks), st.forbid_when_blocked, N(st.max_grants), N(st.confirm_window_ticks)].filter(Boolean).length;
  $("circuit").textContent = t("hdr", { nand: num(c.nand), latch: num(c.latch), n: nRules, holds: t(k.every_rule_holds ? "hdr.holds" : "hdr.fails") });
  const [cc, ck] = chainStatus(s);
  $("chain-dot").className = `dot ${cc}`; $("chain").textContent = t(ck);

  // evidence
  const zh = lang === "zh", words = zh ? ruleWordsZh(st) : p.rules.map(esc);
  $("words").innerHTML = words.map((w, i) => `<li><span>${zh ? esc(w) : w}${zh && p.rules[i] ? `<span class="en">${esc(p.rules[i])}</span>` : ""}</span></li>`).join("");
  const vrow = (ok, head, headNo, body) => `<div class="verdict-row ${ok ? "ok" : "bad"}"><span class="mark">${ok ? "✓" : "✗"}</span><div><div class="head">${t(ok ? head : headNo)}</div><div class="body">${body}</div></div></div>`;
  $("verdicts").innerHTML =
    vrow(k.matches_reference, "ev.match", "ev.match.no", t("ev.match.body", { rows: num(k.rows), inputs: N(c.inputs && c.inputs.length) || 4, state: N(k.domain_bits) - (N(c.inputs && c.inputs.length) || 4), bits: N(k.domain_bits) })) +
    vrow(k.every_rule_holds, "ev.holds", "ev.holds.no", t("ev.holds.body", { reach: num(k.reachable_states), poss: num(k.states_possible), conf: num(k.configurations_visited), proven: num(k.rows_proven) }));
  $("tiles").innerHTML = [
    ["tl.nand", num(c.nand)], ["tl.latch", num(c.latch)], ["tl.bytes", num(c.bytes)], ["tl.depth", num(c.depth)],
    ["tl.ms", `${num(p.compiled_in_ms)}<small>ms</small>`],
  ].map(([kk, v]) => `<div class="tile"><div class="k">${t(kk)}</div><div class="v">${v}</div></div>`).join("");
  const V = k.violations || {};
  $("viol").innerHTML = `<span>${t("viol.head")}</span>` + Object.keys(V).map((name) => `<span>${esc(t("viol." + name))} <b class="${N(V[name]) ? "bad" : ""}">${num(V[name])}</b></span>`).join("");
  $("netlist-sum").textContent = t("netlist", { bytes: num(c.bytes) });
  $("netlist").textContent = String(c.netlist || "");
  $("prov").innerHTML = t("prov", { rules: esc((s.default_rules || []).join("; ")) });

  // channels
  $("channels-lead").innerHTML = t("ch.lead");
  $("a-inputs").textContent = (c.agent_writable || []).join(" · ");
  $("t-inputs").textContent = (c.tool_layer_only || []).join(" · ");
  renderArmed();

  // agents
  const tb = $("agents").querySelector("tbody");
  if (!s.agents.length) tb.innerHTML = `<tr><td class="muted">${t("ag.none")}</td></tr>`;
  else {
    const L = (kk) => `data-l="${esc(t(kk))}"`;
    tb.innerHTML = `<tr>${["ag.name", "ag.ticks", "ag.grants", "ag.cool", "ag.streak", "ag.used", "ag.window", "ag.armed"].map((kk) => `<th>${t(kk)}</th>`).join("")}</tr>` +
      s.agents.map((a) => {
        const cool = N(st.min_gap_ticks) > 1 ? (N(a.cooldown_left) ? `<span class="amber">${t("ag.left", { n: num(a.cooldown_left) })}</span>` : `<span class="ok">${t("ag.ready")}</span>`) : `<span class="muted">${t("ag.norule")}</span>`;
        const streak = N(st.commit_ticks) ? (N(a.intent_streak) >= N(st.commit_ticks) ? `<span class="ok">${t("ag.streak.sat", { b: num(st.commit_ticks) })}</span>` : t("ag.of", { a: num(a.intent_streak), b: num(st.commit_ticks) })) : `<span class="muted">${t("ag.norule")}</span>`;
        const used = N(st.max_grants) ? `<span class="${N(a.grants_used) >= N(st.max_grants) ? "bad" : ""}">${t("ag.of", { a: num(a.grants_used), b: num(st.max_grants) })}</span>` : `<span class="muted">${t("ag.norule")}</span>`;
        const win = N(st.confirm_window_ticks) ? (N(a.armed_confirm) ? `<span class="ok">${t("ag.window.armed")}</span>` : N(a.confirm_window_left) ? `<span class="ok">${t("ag.left", { n: num(a.confirm_window_left) })}</span>` : `<span class="amber">0</span>`) : `<span class="muted">${t("ag.norule")}</span>`;
        const armed = `<span class="mono"><span class="${N(a.armed_blocked) ? "c-tool" : ""}">blocked ${N(a.armed_blocked)}</span> · <span class="${N(a.armed_confirm) ? "c-tool" : ""}">confirm ${N(a.armed_confirm)}</span></span>`;
        return `<tr><td class="name">${esc(a.agent)}</td><td class="num" ${L("ag.ticks")}>${num(a.ticks)}</td><td class="num" ${L("ag.grants")}>${num(a.grants)}</td>` +
          `<td class="num" ${L("ag.cool")}>${cool}</td><td class="num" ${L("ag.streak")}>${streak}</td><td class="num" ${L("ag.used")}>${used}</td>` +
          `<td class="num" ${L("ag.window")}>${win}</td><td ${L("ag.armed")}>${armed}</td></tr>`;
      }).join("");
  }

  // log
  const tr = s.transcript, reqs = tr.filter((e) => e.kind === "request");
  const g = reqs.filter((e) => e.granted).length;
  $("log-sub").textContent = t("log.sub", { n: tr.length, g, r: reqs.length - g });
  $("log").innerHTML = tr.length ? tr.map(entryHtml).join("") : `<div class="muted">${t("log.none")}</div>`;
}

function renderArmed() {
  const name = $("agent").value || "console";
  const a = STATE && STATE.agents.find((x) => x.agent === name);
  $("armed").innerHTML = a
    ? t("t.armed", { agent: esc(name), b: N(a.armed_blocked), c: N(a.armed_confirm), bc: N(a.armed_blocked) ? "hi" : "", cc: N(a.armed_confirm) ? "hi" : "" })
    : `<span class="muted">${t("t.armed.none", { agent: esc(name) })}</span>`;
}
$("agent").addEventListener("input", renderArmed);

function entryHtml(e) {
  const at = `<div class="t">${clock(e.at)}</div>`;
  if (e.kind === "tool") {
    return `<div class="e tool">${at}<div><div class="h"><span class="verdict">${t("v.tool")}</span><span class="agent">${esc(e.agent)}</span></div>` +
      `<div class="d">${t("e.tool", { b: N(e.blocked), c: N(e.confirm) })}</div></div></div>`;
  }
  if (e.kind === "policy") {
    const cz = e.circuit || {};
    return `<div class="e policy">${at}<div><div class="h"><span class="verdict">${t("v.policy")}</span><span class="agent">${t("e.policy", { rules: esc((e.rules || []).join("; ")) })}</span></div>` +
      `<div class="d">${t("e.policy.s", { nand: num(cz.nand), latch: num(cz.latch), rows: num(e.rows), holds: `<span class="${e.every_rule_holds ? "ok" : "bad"}">${t(e.every_rule_holds ? "hdr.holds" : "hdr.fails")}</span>` })}</div></div></div>`;
  }
  if (e.error) {
    return `<div class="e err">${at}<div><div class="h"><span class="verdict">400</span></div><div class="d">${esc(e.error)}</div></div></div>`;
  }
  const ok = !!e.granted;
  const bits = t("e.bits", { i: N(e.intent), b: `<span class="${N(e.blocked) ? "t1" : ""}">${N(e.blocked)}</span>`, c: `<span class="${N(e.confirm) ? "t1" : ""}">${N(e.confirm)}</span>` });
  const lines = [`<b>${t("e.tick", { n: num(e.tick) })}</b>`];
  if (e.ticks_since_previous_grant != null) lines.push(t("e.gap", { n: num(e.ticks_since_previous_grant) }));
  let why = "";
  if (ok) lines.push(t("e.granted"));
  else if (Array.isArray(e.why) && e.why.length) why = `<div class="d">${t("e.why")}</div><ul class="why">${e.why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>`;
  let chain = "";
  if (e.chain) chain = `<div class="d">${e.chain.error ? `<span class="amber">${t("e.chain.err", { err: esc(e.chain.error) })}</span>`
    : e.chain.agrees ? `<span class="ok">${t("e.chain.ok", { id: N(e.chain.chain_id) })}</span>`
    : `<span class="bad">${t("e.chain.dis", { id: N(e.chain.chain_id), g: N(e.chain.grant) })}</span>`}</div>`;
  return `<div class="e ${ok ? "ok" : "no"}">${at}<div>` +
    `<div class="h"><span class="verdict">${t(ok ? "v.grant" : "v.refuse")}</span><span class="agent">${esc(e.agent)}</span><span class="bits">${bits}</span>` +
    (e.reason ? `<span class="reason">${esc(e.reason)}</span>` : "") + `</div>` +
    `<div class="d">${lines.join(" · ")}</div>${why}${chain}</div></div>`;
}

function showLast(e) {
  LAST = e;
  $("last").innerHTML = e.kind === "tool"
    ? `<span class="c-tool">${t("t.done", { agent: esc(e.agent), b: N(e.blocked), c: N(e.confirm) })}</span>`
    : entryHtml(e).replace(/^<div class="e/, '<div style="padding:0;border:0;background:none" class="e');
}

async function refresh() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
    lastOk = Date.now();
  } catch (e) { /* the service may be restarting; the header dot says so */ }
  liveTick();
}
function liveTick() {
  const now = Date.now();
  const alive = now - lastOk < 6000, settled = lastOk || now - OPENED > 6000;
  $("svc-dot").className = `dot ${settled ? (alive ? "ok" : "bad") : ""}`;
  $("svc").textContent = t(settled ? (alive ? "svc.ok" : "svc.bad") : "svc.wait");
  $("clock").textContent = new Date(now).toLocaleTimeString(locale(), { hour12: false });
}

// ---------- the two channels ----------
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) d.error = d.error || `HTTP ${r.status}`;
  return d;
}
$("req").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("send").disabled = true; $("last").innerHTML = `<span class="muted">${t("l.sending")}</span>`;
  try { showLast(await post("/api/request", { agent: $("agent").value || "console", intent: $("intent").checked ? 1 : 0, reason: $("reason").value })); }
  catch (err) { $("last").innerHTML = `<span class="bad">${t("l.neterr", { e: esc(err.message) })}</span>`; }
  $("send").disabled = false;
  refresh();
});
document.querySelectorAll("[data-tool]").forEach((b) => b.addEventListener("click", async () => {
  const [bit, v] = b.dataset.tool.split(",");
  b.disabled = true;
  try { showLast(await post("/api/tool", { agent: $("agent").value || "console", [bit]: Number(v) })); }
  catch (err) { $("last").innerHTML = `<span class="bad">${t("l.neterr", { e: esc(err.message) })}</span>`; }
  b.disabled = false;
  refresh();
}));

setLang(lang);
refresh();
setInterval(refresh, 2000);
setInterval(liveTick, 1000);
</script>
</html>
