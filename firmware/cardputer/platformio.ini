; The c3s escape core on an M5Stack Cardputer ADV. See docs/FIRMWARE.md.
;
;   pio run -d firmware/cardputer                   build
;   pio run -d firmware/cardputer -t upload         build and flash over USB
;   pio device monitor -b 115200                    tick log
[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The prefix maps keep the build machine's directories out of the image (__FILE__ in the
; Arduino core's asserts and logs).
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -ffile-prefix-map=${platformio.packages_dir}=packages
  -ffile-prefix-map=$PROJECT_DIR=project
lib_deps =
  m5stack/M5Cardputer@1.1.1
  m5stack/M5Unified@0.2.22
  m5stack/M5GFX@0.2.29
  z3t0/IRremote@4.7.1
